name: frontend-ci
on:
  push: { branches: [main], paths: ["frontend/**", "package-lock.json", ".github/workflows/frontend-ci.yml"] }
  pull_request: { paths: ["frontend/**", "package-lock.json", ".github/workflows/frontend-ci.yml"] }

jobs:
  test:
    runs-on: ubuntu-latest
    env: { NEXT_TELEMETRY_DISABLED: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w frontend
      - run: npm run typecheck -w frontend
      - name: Component, a11y (axe) and helper tests
        run: npm test -w frontend
      - run: npm run build -w frontend
